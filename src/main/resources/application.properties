# CARBSS Application Configuration

# Application Info
app.name=CARBSS
app.version=1.0.0
app.description=Conflict-Aware Resource-Bounded Slot Scheduler

# Logging Configuration
logging.level.root=INFO
logging.level.com.scoreme.carbss=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Algorithm Tuning Parameters
carbss.algorithm.alpha.saturation=10.0
carbss.algorithm.beta.conflict=5.0
carbss.algorithm.gamma.urgency=8.0
carbss.algorithm.delta.priority=3.0

# Penalty Function Weights
carbss.penalty.lambda.sla-risk=10.0
carbss.penalty.lambda.load-imbalance=5.0
carbss.penalty.lambda.gpu-fragmentation=8.0

# Repair Engine Configuration
carbss.repair.max-depth=2
carbss.repair.max-attempts=3

# Performance Settings
carbss.scheduler.timeout-ms=30000
carbss.scheduler.enable-early-infeasibility-check=true
